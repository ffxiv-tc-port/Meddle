name: Build Check

on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.x
            10.x
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
      - name: Download Dalamud (pinned TC-compatible build)
        shell: pwsh
        run: |
          $pinUrl = 'https://github.com/ffxiv-tc-port/Dalamud/releases/download/dalamud-pin-v13.0.0.17/dalamud-api13-net9.zip'
          Invoke-WebRequest -Uri $pinUrl -OutFile dalamud-pinned.zip
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath dalamud-pinned.zip).Hash
          if ($sha -ne '1481704F4DACBE96070F7B306FF1CE4BD77DB69C19CD74969FE296643E49EB5B') { throw "pinned Dalamud SHA256 mismatch: $sha" }
          Expand-Archive -Force dalamud-pinned.zip "$env:RUNNER_TEMP\dalamud-pinned\"
      - name: Build with dotnet
        run: dotnet build --configuration Release Meddle/Meddle.Plugin/Meddle.Plugin.csproj -p:DalamudLibPath="$env:RUNNER_TEMP\dalamud-pinned\"

# 本機實測（2026-08-27）：直接建 Meddle/Meddle.Plugin/Meddle.Plugin.csproj 的 `->` 行是
#   Meddle\Meddle.Plugin\bin\Release\Meddle.Plugin.dll
# 打包產物在 Meddle/Meddle.Plugin/bin/Release/Meddle.Plugin/{latest.zip,Meddle.Plugin.json}。
# bin/x64/ 不存在——release.yml 的路徑要跟這裡一致，抄錯會在 write-version 步驟 Cannot find path。
